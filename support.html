<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support & Help Desk — SIAA GALAXY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("vmr_RcHa6I7Ene_Wl");
       })();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

    <header class="w-full border-b border-slate-800/60 backdrop-blur-xl sticky top-0 z-50 bg-slate-950/70">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="flex items-center space-x-3">
                    <img src="1000256664.png" alt="Logo" class="w-11 h-11 rounded-2xl object-cover border border-white/10">
                </a>
                <span class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-white via-blue-200 to-indigo-400 bg-clip-text text-transparent">SIAA Support</span>
            </div>
            <div class="flex items-center space-x-4">
                <a href="dashboard.html" class="px-4 py-2 rounded-xl glass-card text-sm font-bold hover:bg-slate-900 transition">← Back to Portal</a>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-6 py-12 w-full space-y-8">
        <div>
            <h1 class="text-3xl font-black text-white tracking-tight">Enterprise Help Desk</h1>
            <p class="text-sm text-slate-400 mt-1">Submit tickets directly to info@siaaindia.com via siaagalaxy.com.</p>
        </div>

        <div class="glass-card rounded-2xl p-8 space-y-6">
            <h3 class="text-lg font-bold text-white border-b border-slate-800 pb-4">Raise Support Ticket</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Your Email</label>
                    <input type="email" id="userEmail" placeholder="your@email.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Subject / Issue Title</label>
                    <input type="text" id="ticketSubject" placeholder="e.g. siaagalaxy.com server query" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Detailed Description</label>
                    <textarea id="ticketDesc" rows="4" placeholder="Describe your technical query..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition"></textarea>
                </div>
            </div>
            <button onclick="sendSupportEmail()" class="px-6 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 font-bold text-xs shadow-lg shadow-blue-600/30 transition cursor-pointer text-white">Send Ticket via EmailJS 🚀</button>
        </div>
    </main>

    <footer class="w-full border-t border-slate-800/60 py-6 text-center text-xs text-slate-500 glass-card">
        <p>&copy; 2026 SIAA GALAXY (siaagalaxy.com). Founder: Sarvesh Dhar Dwivedi.</p>
    </footer>

    <script>
        function sendSupportEmail() {
            const email = document.getElementById('userEmail').value;
            const subject = document.getElementById('ticketSubject').value;
            const message = document.getElementById('ticketDesc').value;

            if(!email || !subject || !message) {
                alert('Please fill out all fields before submitting.');
                return;
            }

            emailjs.send("service_91707fg", "template_rz0n8kw", {
                from_email: email,
                subject: subject,
                message: message,
                to_email: "info@siaaindia.com"
            }).then(function(response) {
                alert('Support ticket sent successfully via siaagalaxy.com!');
            }, function(error) {
                alert('Failed to send email. Error: ' + JSON.stringify(error));
            });
        }
    </script>
</body>
</html>
