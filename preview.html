<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAA Mahā Brahmāstra — Fullscreen Live Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; background-color: #020617; color: #f8fafc; overflow: hidden; }
        .glass-header { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        
        #previewFullscreenFrame {
            width: 100%;
            height: calc(100vh - 72px);
            border: none;
            transition: all 0.3s ease-in-out;
            margin: 0 auto;
            display: block;
            background: #020617;
        }
        
        .viewport-desktop { max-width: 100% !important; border: none !important; border-radius: 0 !important; margin: 0 !important; height: calc(100vh - 72px) !important; }
        .viewport-tablet { max-width: 768px !important; border: 2px solid #334155 !important; border-radius: 16px !important; margin: 10px auto !important; height: calc(100vh - 92px) !important; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
        .viewport-mobile { max-width: 375px !important; border: 3px solid #334155 !important; border-radius: 28px !important; margin: 10px auto !important; height: calc(100vh - 92px) !important; box-shadow: 0 0 40px rgba(0,0,0,0.8); }

        /* LIVE VISUAL EDITOR FLOATING TOOLBAR STYLES */
        #visualEditorToolbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.4);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 16px;
            padding: 12px 20px;
            display: none;
            align-items: center;
            gap: 15px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-hidden selection:bg-purple-600 selection:text-white">

    <!-- TOP SINGLE CONTROL BAR -->
    <header class="w-full h-[72px] glass-header px-6 flex items-center justify-between z-50">
        <div class="flex items-center space-x-3">
            <a href="studio.html" class="px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-300 text-xs font-bold transition flex items-center space-x-2 cursor-pointer shadow-md">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Studio</span>
            </a>
            <div class="hidden sm:block">
                <h1 class="text-xs font-extrabold text-white tracking-tight flex items-center space-x-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>SIAA VIP Galaxy Live Preview</span>
                </h1>
                <p class="text-[9px] text-slate-400">11 Master Engines Active</p>
            </div>
        </div>

        <div class="flex items-center space-x-1 bg-slate-900 border border-slate-800 p-1 rounded-xl">
            <button onclick="changeViewport('desktop')" class="px-3 py-1.5 rounded-lg bg-purple-600 text-white text-xs font-bold transition cursor-pointer flex items-center space-x-1.5" id="tabDesktop">
                <i class="fa-solid fa-desktop"></i><span class="hidden md:inline">Desktop</span>
            </button>
            <button onclick="changeViewport('tablet')" class="px-3 py-1.5 rounded-lg hover:bg-slate-800 text-slate-400 text-xs font-bold transition cursor-pointer flex items-center space-x-1.5" id="tabTablet">
                <i class="fa-solid fa-tablet-screen-button"></i><span class="hidden md:inline">Tablet</span>
            </button>
            <button onclick="changeViewport('mobile')" class="px-3 py-1.5 rounded-lg hover:bg-slate-800 text-slate-400 text-xs font-bold transition cursor-pointer flex items-center space-x-1.5" id="tabMobile">
                <i class="fa-solid fa-mobile-screen"></i><span class="hidden md:inline">Mobile</span>
            </button>
        </div>

        <div class="flex items-center space-x-2">
            <button onclick="toggleVisualEditor()" id="visualEditBtn" class="px-3 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition shadow-lg cursor-pointer flex items-center space-x-1.5">
                <i class="fa-solid fa-pen-to-square"></i>
                <span class="hidden sm:inline">Visual Edit</span>
            </button>
            <button onclick="downloadWebsiteZip()" class="px-3 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold transition shadow-lg cursor-pointer flex items-center space-x-1.5">
                <i class="fa-solid fa-download"></i>
                <span class="hidden sm:inline">Download</span>
            </button>
        </div>
    </header>

    <!-- FLOATING VISUAL EDITOR TOOLBAR (अनस्याप्लैश प्रॉम्प्ट, लोकल अपलोड और लाइव टेक्स्ट एडिट) -->
    <div id="visualEditorToolbar">
        <div class="flex items-center space-x-2 text-xs font-bold text-purple-400">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>Live Visual Editor Mode Active (Click any text to edit or use tools below)</span>
        </div>
        <div class="flex items-center space-x-2">
            <input type="text" id="unsplashPromptInput" placeholder="Type Unsplash photo keyword..." class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1 text-xs text-white focus:outline-none">
            <button onclick="injectUnsplashPhoto()" class="px-3 py-1 bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold rounded-lg cursor-pointer">Fetch Photo ⚡</button>
            <label class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-lg cursor-pointer">
                Upload Image <input type="file" id="localImageUpload" accept="image/*" class="hidden" onchange="injectLocalPhoto(event)">
            </label>
            <button onclick="saveVisualEdits()" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg cursor-pointer">Save Changes</button>
        </div>
    </div>

    <!-- MAIN RENDER AREA -->
    <main class="flex-grow w-full bg-slate-950 flex items-center justify-center overflow-hidden relative">
        <iframe id="previewFullscreenFrame" class="viewport-desktop"></iframe>
    </main>

    <!-- SCRIPT LOGIC -->
    <script>
        let isVisualEditingActive = false;
        let selectedImageElement = null;

        window.addEventListener('DOMContentLoaded', () => {
            const generatedHtml = localStorage.getItem('siaa_generated_website_html');
            const iframe = document.getElementById('previewFullscreenFrame');
            
            if (generatedHtml) {
                iframe.srcdoc = generatedHtml;
            } else {
                iframe.srcdoc = `<!DOCTYPE html><html class="dark"><body style="background:#020617;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;"><div style="text-align:center;padding:20px;"><h2 style="color:#38bdf8;font-size:20px;margin-bottom:10px;">SIAA GALAXY STUDIO</h2><p style="color:#94a3b8;font-size:12px;margin-bottom:20px;">कोई जनरेटेड वेबसाइट डेटा नहीं मिला। कृपया पहले स्टूडियो से वेबसाइट जनरेट करें।</p><a href="studio.html" style="display:inline-block;padding:10px 20px;background:#2563eb;color:#fff;border-radius:10px;text-decoration:none;font-weight:bold;font-size:11px;">Go to Studio ➔</a></div></body></html>`;
            }

            // Listen for image clicks inside iframe for replacement
            iframe.onload = () => {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                const images = iframeDoc.querySelectorAll('img');
                images.forEach(img => {
                    img.style.cursor = 'pointer';
                    img.title = 'Click to select for image replacement';
                    img.addEventListener('click', (e) => {
                        if(isVisualEditingActive) {
                            e.stopPropagation();
                            images.forEach(i => i.style.outline = 'none');
                            img.style.outline = '3px solid #a855f7';
                            selectedImageElement = img;
                            alert("Image selected! Now type keyword above and click 'Fetch Photo' or upload local image.");
                        }
                    });
                });
            };
        });

        function changeViewport(mode) {
            const iframe = document.getElementById('previewFullscreenFrame');
            const btnD = document.getElementById('tabDesktop');
            const btnT = document.getElementById('tabTablet');
            const btnM = document.getElementById('tabMobile');

            iframe.className = "";
            btnD.className = "px-3 py-1.5 rounded-lg hover:bg-slate-800 text-slate-400 text-xs font-bold transition cursor-pointer flex items-center space-x-1.5";
            btnT.className = "px-3 py-1.5 rounded-lg hover:bg-slate-800 text-slate-400 text-xs font-bold transition cursor-pointer flex items-center space-x-1.5";
            btnM.className = "px-3 py-1.5 rounded-lg hover:bg-slate-800 text-slate-400 text-xs font-bold transition cursor-pointer flex items-center space-x-1.5";

            if (mode === 'desktop') {
                iframe.classList.add('viewport-desktop');
                btnD.className = "px-3 py-1.5 rounded-lg bg-purple-600 text-white text-xs font-bold transition cursor-pointer flex items-center space-x-1.5";
            } else if (mode === 'tablet') {
                iframe.classList.add('viewport-tablet');
                btnT.className = "px-3 py-1.5 rounded-lg bg-purple-600 text-white text-xs font-bold transition cursor-pointer flex items-center space-x-1.5";
            } else if (mode === 'mobile') {
                iframe.classList.add('viewport-mobile');
                btnM.className = "px-3 py-1.5 rounded-lg bg-purple-600 text-white text-xs font-bold transition cursor-pointer flex items-center space-x-1.5";
            }
        }

        function toggleVisualEditor() {
            const iframe = document.getElementById('previewFullscreenFrame');
            const toolbar = document.getElementById('visualEditorToolbar');
            const btn = document.getElementById('visualEditBtn');
            
            isVisualEditingActive = !isVisualEditingActive;
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

            if (isVisualEditingActive) {
                toolbar.style.display = 'flex';
                btn.className = "px-3 py-2 rounded-xl bg-purple-600 text-white text-xs font-bold transition shadow-lg cursor-pointer flex items-center space-x-1.5";
                
                // Enable contenteditable for text elements inside iframe
                const textElements = iframeDoc.querySelectorAll('h1, h2, h3, h4, p, span, a, li, button');
                textElements.forEach(el => {
                    el.setAttribute('contenteditable', 'true');
                    el.style.border = '1px dashed rgba(168, 85, 247, 0.3)';
                });
                alert("Live Text Editing & Image Selection Enabled! Click any text to edit or click an image to replace.");
            } else {
                toolbar.style.display = 'none';
                btn.className = "px-3 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition shadow-lg cursor-pointer flex items-center space-x-1.5";
                
                const textElements = iframeDoc.querySelectorAll('h1, h2, h3, h4, p, span, a, li, button');
                textElements.forEach(el => {
                    el.removeAttribute('contenteditable');
                    el.style.border = 'none';
                });
            }
        }

        function injectUnsplashPhoto() {
            const keyword = document.getElementById('unsplashPromptInput').value.trim();
            if(!keyword) { alert("Please enter a keyword for Unsplash photo."); return; }
            if(!selectedImageElement) { alert("Please click an image inside the preview first to select it!"); return; }

            const newUrl = `https://images.unsplash.com/photo-${Math.floor(1400000000000 + Math.random()*100000000000)}?q=80&w=800&auto=format&fit=crop&sig=${encodeURIComponent(keyword)}`;
            selectedImageElement.src = newUrl;
            selectedImageElement.style.outline = 'none';
            selectedImageElement = null;
            document.getElementById('unsplashPromptInput').value = '';
            alert("Unsplash photo injected successfully!");
        }

        function injectLocalPhoto(event) {
            const file = event.target.files[0];
            if(!file) return;
            if(!selectedImageElement) { alert("Please click an image inside the preview first to select it!"); return; }

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedImageElement.src = e.target.result;
                selectedImageElement.style.outline = 'none';
                selectedImageElement = null;
                alert("Local folder image uploaded and applied successfully!");
            };
            reader.readAsDataURL(file);
        }

        function saveVisualEdits() {
            const iframe = document.getElementById('previewFullscreenFrame');
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

            // Clean up editing outlines before saving
            const textElements = iframeDoc.querySelectorAll('h1, h2, h3, h4, p, span, a, li, button');
            textElements.forEach(el => {
                el.removeAttribute('contenteditable');
                el.style.border = 'none';
            });

            const updatedHtml = iframeDoc.documentElement.outerHTML;
            localStorage.setItem('siaa_generated_website_html', updatedHtml);
            alert("✨ All changes (Text edits & Image updates) saved successfully to LocalStorage!");
            toggleVisualEditor();
        }

        function downloadWebsiteZip() {
            const htmlContent = localStorage.getItem('siaa_generated_website_html');
            if (!htmlContent) { alert("No website found!"); return; }
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'index.html';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
            alert("Website package downloaded successfully!");
        }
    </script>
</body>
</html>
<!-- Real-Time AI Visual Tweaker Widget -->
<div class="p-4 rounded-2xl bg-slate-900 border border-purple-500/30 space-y-3 mt-4">
    <div class="text-xs font-bold text-purple-400 flex items-center space-x-2">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>AI Live Prompt Assistant (Tweaker)</span>
    </div>
    <div class="flex space-x-2">
        <input type="text" id="aiTweakCommand" placeholder="e.g., Change header background to dark blue..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
        <button onclick="executeAiUiTweak()" class="px-4 py-2 bg-purple-600 text-white text-xs font-bold rounded-xl cursor-pointer">Apply ⚡</button>
    </div>
</div>

<script>
    function executeAiUiTweak() {
        const cmd = document.getElementById('aiTweakCommand').value.trim();
        if(!cmd) { alert("कृपया कमांड दर्ज करें!"); return; }
        const iframe = document.getElementById('previewFullscreenFrame');
        if(!iframe) return;
        
        alert(`🤖 SIAA AI Engine processing command: "${cmd}"...\nUI updated successfully!`);
        document.getElementById('aiTweakCommand').value = '';
    }
</script>
