<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dedicated Preview — SIAA GALAXY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("vmr_RcHa6I7Ene_Wl");
       })();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white" onclick="checkAuthAndProceed(event)">

    <!-- Top Bar matching dashboard & support layout -->
    <header class="w-full border-b border-slate-800/60 backdrop-blur-xl sticky top-0 z-50 bg-slate-950/70 px-6 h-20 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <a href="studio.html" class="px-4 py-2 rounded-xl glass-card text-sm font-bold hover:bg-slate-900 transition">← Back to Studio</a>
            <span id="projectTitleHeader" class="text-sm font-extrabold text-white">Loading Project...</span>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="deployLiveProject(event)" class="px-4 py-2.5 rounded-xl bg-green-600 hover:bg-green-500 text-sm font-bold text-white transition shadow-lg shadow-green-600/30 cursor-pointer">Deploy Live 🚀</button>
            <a href="dashboard.html" class="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-sm font-bold text-white transition shadow-lg shadow-blue-600/30">Client Portal</a>
        </div>
    </header>

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/85 backdrop-blur-md hidden">
        <div class="glass-card p-8 rounded-3xl max-w-md w-full mx-4 border border-blue-500/40 shadow-2xl space-y-6 relative text-center">
            <button type="button" onclick="closeLoginModal(event)" class="absolute top-5 right-5 text-slate-400 hover:text-white font-bold text-base cursor-pointer">✕</button>
            <div class="space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-blue-600/20 border border-blue-500/40 flex items-center justify-center text-blue-400 mx-auto font-bold text-xl">🔒</div>
                <h3 class="text-2xl font-black text-white">Authentication Required</h3>
                <p class="text-xs text-slate-400">Please sign in to access SIAA Galaxy preview production and cloud deployment.</p>
            </div>
            <button type="button" onclick="handleGoogleLogin(event)" class="w-full py-3.5 rounded-xl bg-white text-slate-900 font-bold text-sm flex items-center justify-center space-x-3 cursor-pointer shadow-lg hover:bg-slate-100 transition">
                <span>Sign in with Google</span>
            </button>
        </div>
    </div>

    <!-- Full Screen Rendered Application View -->
    <main id="fullPreviewBody" class="flex-grow flex flex-col items-center justify-center p-6">
        <div class="animate-pulse text-blue-400 font-bold">Loading your generated application...</div>
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-slate-800/60 py-6 text-center text-xs text-slate-500 glass-card">
        <p>&copy; 2026 SIAA GALAXY (siaagalaxy.com). Founder: Sarvesh Dhar Dwivedi. All rights reserved.</p>
    </footer>

    <!-- Script Logic & EmailJS Integration -->
    <script>
        let isUserLoggedIn = false; 

        window.onload = function() {
            const savedData = localStorage.getItem('siaa_latest_project');
            const bodyContainer = document.getElementById('fullPreviewBody');
            const titleHeader = document.getElementById('projectTitleHeader');

            if(savedData) {
                const project = JSON.parse(savedData);
                titleHeader.innerText = project.title;
                bodyContainer.innerHTML = `
                    <div class="max-w-4xl w-full glass-card p-8 rounded-3xl border border-blue-500/30 shadow-2xl space-y-6 text-center">
                        <span class="px-3 py-1 rounded-full bg-blue-500/10 text-blue-400 text-xs font-bold border border-blue-500/20">Live Production Preview</span>
                        <h1 class="text-3xl md:text-5xl font-black text-white">${project.title}</h1>
                        <div class="w-full h-96 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl relative">
                            <img src="${project.image}" class="w-full h-full object-cover" alt="Preview Image">
                        </div>
                        <p class="text-sm text-slate-400 max-w-xl mx-auto">This complete website layout was generated autonomously through SIAA AI Studio using your custom prompt and Unsplash API integration.</p>
                        <div class="flex justify-center gap-4 pt-4">
                            <button onclick="triggerProtectedAction(event, 'Edit')" class="px-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 font-bold text-sm text-white cursor-pointer shadow-lg shadow-blue-600/30">Edit Layout</button>
                            <button onclick="window.location.href='studio.html'" class="px-6 py-3 rounded-xl glass-card hover:bg-slate-900 font-bold text-sm text-slate-200 cursor-pointer">Create Another App</button>
                        </div>
                    </div>
                `;
            } else {
                titleHeader.innerText = "No Project Found";
                bodyContainer.innerHTML = `<div class="text-slate-400 text-sm">No active project found. Please go back to <a href="studio.html" class="text-blue-400 underline">AI Studio</a> and generate a new website.</div>`;
            }
        };

        function checkAuthAndProceed(event) {
            if(event.target.closest('#loginModal') || event.target.tagName === 'HEADER' || event.target.tagName === 'A') return;
            if (!isUserLoggedIn) {
                event.stopPropagation();
                document.getElementById('loginModal').classList.remove('hidden');
            }
        }

        function triggerProtectedAction(event, actionName) {
            event.stopPropagation();
            if (!isUserLoggedIn) {
                document.getElementById('loginModal').classList.remove('hidden');
            } else {
                alert(`Executing action: ${actionName}`);
            }
        }

        function deployLiveProject(event) {
            event.stopPropagation();
            if (!isUserLoggedIn) {
                document.getElementById('loginModal').classList.remove('hidden');
            } else {
                // EmailJS automated notification when project is deployed live
                emailjs.send("service_91707fg", "template_rz0n8kw", {
                    from_email: "thenewindia04@gmail.com",
                    subject: "SIAA Galaxy Project Live Deployment",
                    message: "A new project has been successfully deployed live via siaagalaxy.com preview page.",
                    to_email: "info@siaaindia.com"
                }).then(function(response) {
                    alert('Project successfully deployed to SIAA Cloud & notification email sent via EmailJS!');
                }, function(error) {
                    alert('Project deployed live, but email notification failed.');
                });
            }
        }

        function closeLoginModal(event) {
            if(event) event.stopPropagation();
            document.getElementById('loginModal').classList.add('hidden');
        }

        function handleGoogleLogin(event) {
            if(event) event.stopPropagation();
            isUserLoggedIn = true;
            document.getElementById('loginModal').classList.add('hidden');
            alert('Successfully authenticated via Google! Welcome to SIAA Galaxy.');
        }
    </script>
</body>
</html>
